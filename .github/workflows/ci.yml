name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job here writes to the repo, and the images job builds and
# runs a container from the pull request's own Dockerfile, so the code under
# test can reach the job's token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The one command AGENTS.md documents, not a copy of its four steps: a
      # step added to `check` has to run here without anyone editing this file.
      - run: npm run check
      - name: Build the product web
        run: npm run build --workspace=@computer/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck apps/desk/bin/* deploy/fly/*.sh

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/desk/Dockerfile
          ignore: DL3008
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/fly/Dockerfile
          ignore: DL3008
      - name: Build the local desk image
        run: docker build -t computer-desk apps/desk
      - name: Smoke-test the desk (X up, screenshot is a PNG)
        run: |
          docker run -d --name desk --shm-size=1g computer-desk
          for _ in $(seq 1 30); do
            docker exec desk bash -c 'DISPLAY=:1 xdpyinfo >/dev/null 2>&1' && break
            sleep 1
          done
          docker exec desk bash -c 'DISPLAY=:1 xdpyinfo | head -1'
          docker exec desk /usr/local/bin/desk-shot > shot.png
          file shot.png | grep -q 'PNG image data, 1280 x 800'
          docker rm -f desk
