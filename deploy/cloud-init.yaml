#cloud-config
# Always-hot alternate, a standing Ubuntu VM (Hetzner CX33 works well).
# The Grok-like default is a Fly Machine (fly.toml) that can sleep.
# Use this when you want the box on 24/7 and you already have a VPS.
#
#   1. Create the server with this file as cloud-init user data.
#   2. ssh in, run: tailscale up
#   3. cd /opt/computer && npm run up   (needs the Docker daemon; prints the QR)
#
# The hub stays on loopback; Tailscale Serve is the only way in.
# This is not wake-on-connect: the VM stays billed while it runs.

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - curl -fsSL https://tailscale.com/install.sh | sh
  # Node 24, matching `engines` in package.json.
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs
  - git clone https://github.com/mblode/expert-computer /opt/computer
  - cd /opt/computer && npm ci
