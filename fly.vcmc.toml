# Vibey computer. Same image as fly.toml (desk + hub + Eve runner).
# Deploy only with this file so `fly deploy` from the repo root still
# targets the Blode app and cannot mutate mblode-computer:
#   fly secrets set COMPUTER_SETUP_CODE="$(openssl rand -hex 16)" -c fly.vcmc.toml
#   fly deploy -c fly.vcmc.toml
#
# Pairing code is this Machine's secret, not Blode's. Volume is this app's
# existing `vcmc_workspace` (10 GB, syd). Do not create a second volume.
# A later Eve tree (vcmc-agent) goes on the volume at /workspace/eve/bots
# (standalone Eve app or bots/main). Do not copy that source into this repo.
#
# CPU can idle to $0. Disk cannot. Same suspend size as Blode.

app = "vcmc-computer"
primary_region = "syd"

[build]
dockerfile = "deploy/fly/Dockerfile"

[processes]
computer = "/usr/local/bin/guest-entrypoint.sh"

[env]
COMPUTER_CLOUD = "fly"
COMPUTER_BIND = "0.0.0.0"
COMPUTER_PORT = "8080"
COMPUTER_URL = "http://127.0.0.1:8080"
HOME = "/home/box"
# Guest-side idle hint. Fly Proxy suspend (auto_stop_machines) is what
# zeros compute. This env is not a substitute for auto_stop = off.
COMPUTER_IDLE_SUSPEND_SEC = "1200"
COMPUTER_VNC_TTL_SEC = "900"
COMPUTER_NOVNC_BASE = "6080"
COMPUTER_VNC_TOKEN_DIR = "/tmp/computer-vnc"
COMPUTER_DESK = "local"
COMPUTER_DATA = "/workspace/.computer/bots.json"
COMPUTER_VNC_HOST = "127.0.0.1"
COMPUTER_VNC_PORT = "5900"
# Image default until /workspace/eve/bots is populated; then the overlay wins.
COMPUTER_EVE_BOTS = "/opt/computer/apps/eve/bots"

[http_service]
processes = ["computer"]
internal_port = 8080
force_https = true
# Suspend (not stop): faster wake; CPU/RAM bill $0 while suspended.
# Railway WhatsApp bridge POST starts it again.
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 20
hard_limit = 40

[[http_service.checks]]
grace_period = "40s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[mounts]]
source = "vcmc_workspace"
destination = "/workspace"
processes = ["computer"]

# shared-cpu-2x / 2 GB. Same size as Blode. WhatsApp + a desk.
[[vm]]
processes = ["computer"]
cpu_kind = "shared"
cpus = 2
memory = "2gb"

[deploy]
strategy = "immediate"
