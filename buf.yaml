# api/computer.proto is the wire source of truth (DESIGN.md).
version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  except:
    # Plan keeps the proto at api/computer.proto, not api/computer/v1/.
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY
    # DESIGN names are Agent/Seat, not *Service.
    - SERVICE_SUFFIX
    # Seat/Agent reuse Type, BoxStatus, Clipboard as request/response names.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
