# The clock outside the box.
#
# A computer suspends to zero when nobody is using it, and a suspended Machine
# has no clock, so a routine whose minute passes while it is down does not
# fire and nothing catches it up. Every in-guest fix is circular: croner, the
# hub's own alarm, supercronic in the image, all of them are stopped too. Fly's
# scheduled Machines are documented as fuzzy interval buckets timed from the
# machine's creation, which is not something to hang a morning brief on. What
# is left is Fly's own answer for work that has to happen at a time: a small
# always-on app that pokes the app that sleeps.
#
# This is that app, one per fleet rather than one per tenant: it wakes every
# computer in CLOCK_TARGETS. It holds only wake-registration credentials. `/healthz` on a tenant is
# public, unauthenticated, and the only route it calls, so the worst this app
# can do to a computer is start it.
#
# Fly's task-scheduling guide reaches for a process group inside the app
# first, and that is the wrong shape here for three reasons: a process group
# shares the app's image, and the guest image is a desk, a Chromium and eight
# Bots to run a timer; it shares the app's secrets, which is the one thing
# this app is defined by not having; and it would put every tenant's routines
# inside one tenant's app, its deploys and its region. A separate app is what
# is left, which is also the shape of Fly's own Cron Manager.
#
# Deploy: fly deploy -c fly.clock.toml
app = "expert-clock"
primary_region = "syd"

[build]
dockerfile = "deploy/clock/Dockerfile"

[env]
# The tenants' PUBLIC hostnames. Never <app>.internal: 6PN skips Fly Proxy,
# and only the proxy starts a suspended Machine, so a private-network request
# reaches a sleeping tenant as a connection error rather than a wake.
#
# Blode only, deliberately. Vibey runs the same guest image but its Eve is an
# overlay on that Machine's volume (`/workspace/eve/bots`), so its routines
# are not in this repo and not in this image: waking it on Blode's schedule
# would wake it at the wrong minutes and still miss its own. Adding it here
# means getting its manifests into this image first.
CLOCK_TARGETS = "mblode-computer=https://mblode-computer.fly.dev"
CLOCK_BOTS = "/opt/clock/apps/eve/bots"
CLOCK_PORT = "8080"
CLOCK_REGISTRATION_PATH = "/data/registrations.json"

[[mounts]]
source = "clock_data"
destination = "/data"

# No [http_service] and no [[services]] on purpose. Nothing needs to reach the
# clock from the internet, and a Machine with no services is one Fly Proxy
# never autostops: this app is up because it has nothing to suspend for, not
# because a min_machines_running setting says so.
#
# 256 MB and one shared CPU: the process is a timer, a fetch and a JSON page.
#
# One Machine owns the registration volume. Do not scale this file-backed
# registry to multiple writers. Replication needs a shared durable store.
[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"

# A Machine check rather than a proxy one, since there is no service to check
# through. It fails when the clock has no schedule or no targets, which is the
# one way this app breaks quietly: a clock that is up and waking nothing looks
# exactly like a clock that is working.
[checks]
[checks.schedule]
type = "http"
port = 8080
method = "get"
path = "/healthz"
interval = "60s"
timeout = "5s"
grace_period = "20s"

# A clock that exits is a clock that is not keeping time; bring it back.
[[restart]]
policy = "always"

[deploy]
strategy = "immediate"
