[package]
name = "computer"
version = "0.1.0"
description = "Computer desktop — the same cloud computer as the web client"
authors = ["Computer"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "computer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
