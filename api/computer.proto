syntax = "proto3";

package computer.v1;

// Source of truth for behaviour: DESIGN.md
// Agent-loadable JSON: spec.json

service Agent {
  rpc Spec(SpecRequest) returns (SpecResponse);
  // Who this Bot is, composed by the hub from its own files on the box: the
  // profile, the brief, and the index of its skills. The harness calls it and
  // folds the answer into the system prompt; it is not a tool and the model
  // never sees it, exactly as Spec is not one. It is here rather than on Seat
  // because the caller is the Bot, identified by its agent token, and because
  // the alternative is every harness composing an identity of its own out of
  // read_file and drifting from the hub that writes it.
  rpc Identity(IdentityRequest) returns (IdentityResponse);
  // The only voice. Plain model text is a private scratchpad; the human
  // sees nothing the agent did not send here. A widget or secret_request
  // ends the turn, and a second send in the same turn is rejected.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Computer(ComputerRequest) returns (ComputerResponse);
  rpc Shell(ShellRequest) returns (ShellResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
}

service Seat {
  rpc Pair(PairRequest) returns (PairResponse);
  rpc Status(StatusRequest) returns (BoxStatus);
  rpc SetPresence(SetPresenceRequest) returns (BoxStatus);
  rpc Pointer(PointerRequest) returns (PointerResponse);
  rpc Type(SeatTypeRequest) returns (PointerResponse);
  rpc ClipboardGet(ClipboardGetRequest) returns (Clipboard);
  rpc ClipboardSet(ClipboardSetRequest) returns (Clipboard);
  // The thread the human sees. Cursor-paged: the phone restores it on
  // launch instead of replaying the whole log.
  rpc Occurrences(OccurrencesRequest) returns (OccurrencesResponse);
  // Every place a Bot's voice speaks: the picker a phone needs before it can
  // ask for a thread, and the audit view of a bot-to-bot hop. Owner seat
  // only, and contained by the screen the seat was minted for.
  rpc Conversations(ConversationsRequest) returns (ConversationsResponse);
  // Coding sessions. The work runs off this computer, on the runner's own
  // machine, and the hub keeps the thread: a session is a conversation with
  // a `code` route, so the phone and the web read it where they read
  // everything else. Delegated on purpose, because a coding harness on this
  // box would be a door with no policy in front of it, would outlive the
  // 120 s `shell`, and would pin a Machine that should suspend. Work that
  // needs the box (this computer's own code, the signed-in browser) is not
  // this RPC.
  rpc StartCodingSession(StartCodingSessionRequest) returns (CodingSession);
  // Re-read one from the runner and record anything new in its thread.
  // There is no list RPC: a coding session is a conversation, so Conversations
  // already lists them, with `repo` and `agent` on the route.
  rpc RefreshCodingSession(RefreshCodingSessionRequest) returns (CodingSession);
  // Deliver a masked value for an open secret_request. The value goes to
  // the box clipboard and is never stored, logged, or returned.
  rpc ProvideSecret(ProvideSecretRequest) returns (ProvideSecretResponse);
  // Provisioning: a paired seat is the box owner. The hub allocates the
  // next free screen and mints the Bot's token, returned exactly once. The
  // `installer` role is the one narrower way in, for authoring a connection
  // file, which needs an agent token and so needs a Bot.
  rpc CreateBot(CreateBotRequest) returns (BotCredentials);
  rpc DeleteBot(DeleteBotRequest) returns (BoxStatus);
  // Who a Bot is: the name it answers to, its label, what it is for, and the
  // mark a human recognises it by. The hub folds the profile into that Bot's
  // system prompt, so editing it changes how the agent behaves; it is an
  // owner's edit rather than an operator's, who drives the box without
  // reshaping it. The request is the whole profile, not a patch.
  rpc SetBotProfile(SetBotProfileRequest) returns (BotProfile);
  // A Bot's whole setup as one portable document: its profile, its brief,
  // what it remembers, its skills, its routines and the services it expects.
  // Export reads the box and the Bot's Eve project; apply writes the box and
  // only the box, so a template is never a way to edit the image. Neither
  // carries a credential, a token, or the name of the computer it came from:
  // a template is published to strangers, and installing one is consenting to
  // run its instructions, which is why every section is shown before it does.
  rpc ExportBotTemplate(ExportBotTemplateRequest) returns (ExportBotTemplateResponse);
  rpc ApplyBotTemplate(ApplyBotTemplateRequest) returns (BotProfile);
  // Drop a seat token: the caller's own (sign-out), any other from an owner
  // seat, or any unprivileged one from an issuer replacing a grant it made.
  // Guest seats from invites expire on their own; this is early.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Hand a named person a seat. An owner may issue any role; an `issuer`,
  // which is what a control plane holds instead of the setup code, may issue
  // only the working roles. That containment is the point: a stolen control
  // plane can take the mouse, not own the box forever.
  rpc Issue(IssueRequest) returns (IssueResponse);
  // WhatsApp is a channel of a Bot: a number linked from hello.expert by
  // pairing code or QR, a socket on this computer, groups the owner ticks.
  // Owner seat only. The hub proxies these to the bridge process it runs.
  rpc WhatsAppAccounts(WhatsAppAccountsRequest) returns (WhatsAppAccountsResponse);
  rpc WhatsAppLink(WhatsAppLinkRequest) returns (WhatsAppLinkState);
  rpc WhatsAppGroups(WhatsAppGroupsRequest) returns (WhatsAppGroupsResponse);
  rpc WhatsAppJoinGroup(WhatsAppJoinGroupRequest) returns (WhatsAppJoinGroupResponse);
  rpc WhatsAppConfig(WhatsAppConfigRequest) returns (WhatsAppConfigResponse);
}

// --- shared ---

message Display {
  int32 width = 1;   // 1280
  int32 height = 2;  // 800
  int32 scale = 3;   // 1
}

message Point {
  int32 x = 1; // 0..1279, pixel of last full screenshot
  int32 y = 2; // 0..799
}

message Rect {
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
}

message Image {
  bytes png = 1;
  // sha256 prefix of the bytes: a name to refer back to once a harness has
  // dropped the image, and two equal ids mean two identical screens.
  string id = 2;
  int32 width = 3;
  int32 height = 4;
  // Zoom only: the region of the full display this crop covers. Coordinates
  // never leave the full display's space, so a crop states its rectangle.
  optional Rect source = 5;
}

enum SeatState {
  SEAT_STATE_UNSPECIFIED = 0;
  SEAT_STATE_AGENT = 1;
  SEAT_STATE_WAITING = 2;
  SEAT_STATE_HUMAN = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_SEAT_HELD = 2;
  ERROR_CODE_OUT_OF_BOUNDS = 3;
  ERROR_CODE_PATH_REJECTED = 4;
  ERROR_CODE_DAEMON_DOWN = 5;
  ERROR_CODE_VALIDATION = 6;
  ERROR_CODE_CONFLICT = 7;
  // A hub policy rule refused the call. Not a failure of the box.
  ERROR_CODE_DENIED = 8;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  // DAEMON_DOWN only. Why the box is unreachable and whether a retry helps.
  // reason: idle_timeout | disconnect | shutdown | not_bound | instance_gone |
  //         hibernated | unknown   (this box emits neither of the first two)
  // phase:  in_flight_cancelled | route_missing | attach | unknown
  string reason = 3;
  string phase = 4;
  bool retryable = 5;
}

message PendingCheck {
  string id = 1;
  string code = 2; // destructive | credential | exfil
  string message = 3;
}

// --- Agent ---

message IdentityRequest {}

message IdentityResponse {
  // Markdown, already assembled. Empty when this Bot has nothing on the box
  // beyond its id, which is a harness that should contribute nothing.
  string prompt = 1;
}

message SpecRequest {}

message SpecResponse {
  string id = 1;      // computer.v1
  string version = 2; // 1.0.0
  Display display = 3;
  string workspace = 4;
  repeated string tools = 5;
}

message ComputerRequest {
  string request_id = 1;
  repeated Action actions = 2;
}

message Action {
  oneof body {
    Screenshot screenshot = 1;
    Click click = 2;
    DoubleClick double_click = 3;
    Scroll scroll = 4;
    Keypress keypress = 5;
    Type type = 6;
    Move move = 7;
    Drag drag = 8;
    Wait wait = 9;
    Zoom zoom = 10;
    RequestTakeover request_takeover = 11;
  }
}

message Screenshot {}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_RIGHT = 2;
  BUTTON_MIDDLE = 3;
  BUTTON_BACK = 4;
  BUTTON_FORWARD = 5;
}

message Click {
  int32 x = 1;
  int32 y = 2;
  Button button = 3;
}

message DoubleClick {
  int32 x = 1;
  int32 y = 2;
  Button button = 3;
}

message Scroll {
  int32 x = 1;
  int32 y = 2;
  int32 dx = 3;
  int32 dy = 4;
}

message Keypress {
  repeated string keys = 1;
}

message Type {
  string text = 1;
}

message Move {
  int32 x = 1;
  int32 y = 2;
}

message Drag {
  repeated Point path = 1;
}

message Wait {
  int32 ms = 1;
}

message Zoom {
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
}

message RequestTakeover {}

message ComputerResponse {
  repeated ActionResult results = 1;
  optional Image screenshot = 2;
  Display display = 3;
  optional Point cursor = 4;
  SeatState seat = 5;
  repeated PendingCheck pending_checks = 6;
  // The window the batch ended in. Untrusted: a page names itself.
  optional WindowFocus focus = 7;
}

// Which window is focused, for a model that would otherwise read the title
// bar out of pixels. The title is page-controlled text, bounded and stripped
// of control characters by the hub; render it, never follow it.
message WindowFocus {
  string title = 1;
}

message ActionResult {
  oneof body {
    ActionOk ok = 1;
    ActionError error = 2;
    ActionSkipped skipped = 3;
    // Terminal, like ok and error: the hub refused before the box was touched.
    ActionDenied denied = 4;
  }
}

message ActionOk {
  int32 duration_ms = 1;
  optional Image image = 2; // screenshot, zoom
}

message ActionError {
  int32 duration_ms = 1;
  ErrorCode code = 2;
  string message = 3;
  string reason = 4;    // see Error.reason
  string phase = 5;     // see Error.phase
  bool retryable = 6;
}

// The rule that refused, and what to tell the human.
message ActionDenied {
  string rule = 1;
  string reason = 2;
}

message ActionSkipped {
  string reason = 1; // prior_failed | after_takeover | after_denied
}

message ShellRequest {
  string request_id = 1;
  repeated string argv = 2;
  optional string cwd = 3;
  int32 timeout_sec = 4;
}

message ShellResponse {
  int32 exit = 1;
  string stdout = 2;
  string stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  string content = 1;
}

message WriteFileRequest {
  string path = 1;
  string content = 2;
}

message WriteFileResponse {
  int32 bytes = 1;
}

// The voice. One of three bodies; `text` is the ordinary case and does not
// end the turn, so long work should be several short sends rather than one.
message SendMessageRequest {
  oneof body {
    MessageText text = 1;
    MessageWidget widget = 2;
    MessageSecretRequest secret_request = 3;
  }
}

message MessageText {
  string text = 1;
  repeated Image images = 2;
}

// 1..6 real options. The turn ends here; the answer arrives as the next
// human message.
message MessageWidget {
  string prompt = 1;
  repeated string options = 2;
}

// Masked input on the seat. The value is delivered to the box clipboard
// and never enters the transcript, the occurrence log, or the model's
// context: the agent is told only that it was provided, and pastes.
message MessageSecretRequest {
  string prompt = 1;
  string label = 2;
}

message SendMessageResponse {
  string occurrence_id = 1;
  // True when this send ended the turn (widget, secret_request).
  bool turn_ended = 2;
  // The conversation this send landed in. With no turn binding that is the
  // Bot's own seat conversation, which is where it has always gone.
  string conversation_id = 3;
}

// --- Seat ---

message PairRequest {
  string code = 1;
}

message PairResponse {
  string token = 1;
  string vnc_url = 2;
  BoxStatus status = 3;
}

message StatusRequest {
  int32 display = 1; // window index (X display number), 0/absent = primary
}

// One Bot's screen on the shared box. Window index = X display number.
message ScreenStatus {
  string bot_id = 1;
  int32 display = 2;
  SeatState state = 3;
  string vnc_url = 4;
}

message BoxStatus {
  SeatState state = 1;
  string vnc_url = 2;
  Display display = 3;
  repeated ScreenStatus screens = 4;
}

message SetPresenceRequest {
  bool present = 1;
  int32 display = 2; // 0/absent = primary
}

message PointerRequest {
  oneof body {
    PointerMove move = 1;
    PointerClick click = 2;
    PointerScroll scroll = 4;
  }
  int32 display = 3; // 0/absent = primary
}

message PointerMove {
  int32 dx = 1;
  int32 dy = 2;
  // Hold the left button across the move: a drag from the phone's trackpad,
  // pressed on the first grabbed move and released on the first ungrabbed one.
  bool grab = 3;
}

// Wheel at the cursor. No x/y: the seat's pointer is where it already is.
message PointerScroll {
  int32 dx = 1;
  int32 dy = 2;
}

message PointerClick {
  Button button = 1;
}

message PointerResponse {
  Point cursor = 1;
  SeatState seat = 2;
}

message SeatTypeRequest {
  string text = 1;
  int32 display = 2; // 0/absent = primary
}

message ClipboardGetRequest {
  int32 display = 1; // 0/absent = primary
}

message ClipboardSetRequest {
  string text = 1;
  int32 display = 2; // 0/absent = primary
}

message Clipboard {
  string text = 1;
}

message OccurrencesRequest {
  // Last seq the caller has. Absent or empty = from the start.
  string cursor = 1;
  int32 limit = 2;
  int32 display = 3;
  // Additive. Absent = the display's Bot seat conversation, which is what
  // this RPC has always returned. A conversation belongs to a Bot, and a
  // seat bound to one screen may not read another screen's Bot by id.
  string conversation_id = 4;
}

// Who wrote a message. `system` carries hop notices and route failures.
message MessageAuthor {
  string kind = 1; // bot | human | system
  string bot = 2;  // kind = bot
  string ref = 3;  // kind = human: the identity on the route, e.g. a WA JID
}

message Occurrence {
  string id = 1;
  int32 seq = 2;
  int64 at = 3;
  string kind = 4; // human | text | widget | secret_request
  string text = 5;
  string prompt = 6;
  repeated string options = 7;
  string answer = 8;
  string label = 9;
  bool provided = 10;
  // The conversation this entry belongs to. The seat thread is one too.
  string conversation_id = 11;
  MessageAuthor author = 12;
  string turn_id = 13;
}

message OccurrencesResponse {
  repeated Occurrence entries = 1;
  string next_cursor = 2;
}

message ConversationsRequest {
  // 0/absent = every screen this seat may see. A seat bound to one screen
  // gets that screen whatever it asks for.
  int32 display = 1;
}

// Where a conversation's messages leave for. Fields are per kind: `acct`
// and `jid` for whatsapp, `bot` for peer, neither for seat.
message ConversationRoute {
  string kind = 1; // seat | whatsapp | peer | code
  string acct = 2;
  string jid = 3;
  string bot = 4;
  // code only: the repository the session works on, and the runner's own
  // durable handle for it. Two sessions on one repository are two threads.
  string repo = 5;
  string agent = 6;
}

// Who is in it. `ref` is the human's identity on the route: a WhatsApp JID,
// or "seat" for the person at the screen.
message ConversationParticipant {
  string kind = 1; // bot | human
  string bot = 2;
  string ref = 3;
  string display_name = 4;
}

// No message bodies: this is the list, Occurrences is the read.
message Conversation {
  string id = 1;
  ConversationRoute route = 2;
  repeated ConversationParticipant participants = 3;
  // The log tail, so a client knows there is something new without paging.
  int32 last_seq = 4;
  string updated_at = 5;
}

message ConversationsResponse {
  repeated Conversation conversations = 1;
}

message StartCodingSessionRequest {
  // Which Bot's thread the session is recorded in. 0/absent = this seat's
  // screen, the same rule every other Seat RPC follows.
  int32 display = 1;
  // https://github.com/<owner>/<name>. The runner takes GitHub and the hub
  // refuses anything else rather than passing a URL through to be guessed at.
  string repo = 2;
  string prompt = 3;
  // Branch or commit to start from. Absent = the repository's default.
  string ref = 4;
  // Ask the runner to open the pull request itself when it finishes.
  bool auto_create_pr = 5;
  // Runner model id, passed through. Absent = the account's own default.
  string model = 6;
}

message RefreshCodingSessionRequest {
  string conversation_id = 1;
}

// One coding session. `state` is the agent-session vocabulary the product
// speaks everywhere: pending | active | awaitingInput | complete | error |
// stale. `branch`, `pr_url` and `summary` are empty until the run has them.
message CodingSession {
  string conversation_id = 1;
  string agent = 2;
  string repo = 3;
  string state = 4;
  // The runner's own page for the run, for a human who wants to watch it there.
  string url = 5;
  string branch = 6;
  string pr_url = 7;
  string summary = 8;
}

message ProvideSecretRequest {
  string occurrence_id = 1;
  string value = 2;
  int32 display = 3;
}

message ProvideSecretResponse {
  bool provided = 1;
}

message CreateBotRequest {
  string id = 1; // short name, e.g. "night"
}

message BotCredentials {
  string id = 1;
  int32 display = 2;
  string token = 3; // shown once; the Bot's identity
}

message DeleteBotRequest {
  string id = 1;
}

message SetBotProfileRequest {
  string id = 1;
  // Required, 1-48 chars. proto3 cannot tell an absent string from an empty
  // one, and none of the three required fields has a meaningful empty value.
  string name = 2;
  // Cleared by an empty string, unlike the three above.
  string title = 3;
  string description = 4;
  // One of AVATAR_SHAPES in packages/shared (eight of them). Anything else
  // is VALIDATION.
  string avatar_shape = 5;
  // One of AVATAR_COLORS in packages/shared (twelve of them). A closed set
  // because the model can rewrite this file itself and the value lands in a
  // client's inline style.
  string avatar_color = 6;
}

// As stored on the box at /workspace/.bots/<id>/profile.json, and as carried
// per Bot on GET /roster.
message BotProfile {
  string id = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string avatar_shape = 5;
  string avatar_color = 6;
}

message ExportBotTemplateRequest {
  string id = 1;
  // Rewrite the export for a stranger: the same assistant with the person
  // taken out of it. A working Bot's brief names their product and its skills
  // name their repository, which is both useless to whoever installs it and a
  // leak. Off exports the Bot verbatim, which is what a backup wants.
  bool generic = 2;
}

message ExportBotTemplateResponse {
  BotTemplate template = 1;
  // Whether the rewrite actually ran. Asking for `generic` and getting false
  // means the document is this Bot as it is (with addresses and phone numbers
  // removed) and `note` says why: a person who ticked the box and was handed
  // their own name back is the failure this field exists to prevent.
  bool generic = 2;
  // One sentence for the person publishing: what was left out, or why the
  // rewrite did not happen. Empty on a verbatim export.
  string note = 3;
}

message ApplyBotTemplateRequest {
  string id = 1;
  BotTemplate template = 2;
}

// A Bot's setup, portable. Caps are BOT_TEMPLATE_MAX in packages/shared and
// are applied on read as well as on write: the document arrives from a
// computer this one has never met.
message BotTemplate {
  // 1. A client meeting a version it does not know should say so, not guess.
  int32 version = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string avatar_shape = 5;
  string avatar_color = 6;
  // The Bot's brief, markdown. Folded into its system prompt on the computer
  // that installs this, which is the whole reason the install page shows it.
  string instructions = 7;
  // Facts, without the dates they were learned on: a shared memory is
  // something the receiving Bot is being told, not something that happened
  // to it. Appended to what that Bot already knows, never written over it.
  repeated string memories = 8;
  repeated BotTemplateSkill skills = 9;
  repeated BotTemplateRoutine routines = 10;
  repeated BotTemplatePlugin plugins = 11;
}

message BotTemplateSkill {
  // Slugged by the receiver, never trusted: it becomes a filename.
  string id = 1;
  string name = 2;
  // The "use when" trigger. The one line that goes in the prompt, so the
  // model knows the skill is there before it reads the body.
  string use_when = 3;
  string body = 4;
}

message BotTemplateRoutine {
  string id = 1;
  string title = 2;
  // Five-field cron, UTC, the subset cronMatches understands. Anything else
  // is dropped rather than carried: a schedule neither alarm can parse is a
  // promise the receiving computer cannot keep.
  string cron = 3;
  string prompt = 4;
}

// A service the Bot expects to reach, never a way in to it. `auth` says what
// the person installing has to provide: a key of their own, or a sign-in.
message BotTemplatePlugin {
  string name = 1;
  string url = 2;
  string auth = 3; // static | oauth
}

message RevokeRequest {
  string token = 1; // absent = the caller's own seat
}

message RevokeResponse {
  bool revoked = 1;
}

message IssueRequest {
  string role = 1;       // owner | operator | viewer | guest | installer | issuer
  string subject = 2;    // who this is for, as the caller names them
  uint32 ttl_sec = 3;    // 0 = no expiry; refused for guest and installer
  uint32 display = 4;    // 0 = any screen
  repeated string methods = 5; // narrows the role, never widens it
  string label = 6;      // shown in the owner's seat list
}

message IssueResponse {
  string token = 1;      // shown once
  string role = 2;
  string subject = 3;
  string expires_at = 4; // ISO, empty when it never expires
}

// --- WhatsApp channel (owner seat) ---

message WhatsAppAccountsRequest {}

message WhatsAppAccount {
  string acct = 1;          // account id on this computer, e.g. "main"
  string bot = 2;           // the Bot this number speaks for
  string connector_id = 3;  // hub connector id the bridge posts to
  string phone = 4;         // digits, no plus; empty until linked
  string status = 5;        // unlinked | linking | open | closed
}

message WhatsAppAccountsResponse {
  repeated WhatsAppAccount accounts = 1;
}

message WhatsAppLinkRequest {
  string acct = 1;
  string action = 2;        // start | status | unlink
  string phone = 3;         // start: request a pairing code for this number
  string bot = 4;           // start on a new account: which Bot, default main
}

message WhatsAppLinkState {
  string acct = 1;
  string status = 2;        // unlinked | linking | open | closed
  string qr = 3;            // raw QR string while linking without a phone
  string pairing_code = 4;  // 8 characters while linking with a phone
  int32 age_ms = 5;         // how old the qr or code is; WhatsApp rotates a QR every 20-60 s
  string phone = 6;
}

message WhatsAppGroupsRequest {
  string acct = 1;
}

message WhatsAppGroup {
  string jid = 1;
  string subject = 2;
  int32 size = 3;
  bool enabled = 4;         // in allowed_groups (an empty allowlist enables all)
}

message WhatsAppGroupsResponse {
  repeated WhatsAppGroup groups = 1;
}

message WhatsAppJoinGroupRequest {
  string acct = 1;
  string invite = 2;        // chat.whatsapp.com link or bare code
}

message WhatsAppJoinGroupResponse {
  string jid = 1;
}

message WhatsAppAccountConfig {
  repeated string allowed_groups = 1;
  string trigger_mode = 2;  // mention | prefix | all
  string trigger_prefix = 3;
  string dm_policy = 4;     // members | allowlist | anyone
  repeated string dm_allowlist = 5;
  int32 image_sends_per_day = 6;
  bool vision_enabled = 7;
  string maintainer_jid = 8;
  repeated string owner_jids = 9;
  repeated string digest_recipient_jids = 10;
  string bot_name = 11;
}

message WhatsAppConfigRequest {
  string acct = 1;
  WhatsAppAccountConfig config = 2; // absent = read
}

message WhatsAppConfigResponse {
  WhatsAppAccountConfig config = 1;
}
