# Local computer. The cloud path is a Fly Machine (fly.toml), not this file.
services:
  desk:
    image: computer-desk
    container_name: computer-desk
    build:
      context: ./apps/desk
    hostname: desk
    restart: unless-stopped
    environment:
      DISPLAY: ":1"
    volumes:
      # Grok's persistence boundary, matched: /workspace and ~/.config
      # survive a rebuild; ~/.local/state and apt packages do not.
      # One volume for ~/.config, not a nested chromium one — nesting works
      # but hides the profile from anyone inspecting or backing up the
      # parent, and every window's profile (chromium, chromium-2…8) is
      # already under here.
      - workspace:/workspace
      - config:/home/box/.config
    ports:
      # x11vnc RFB (localhost on the box; published on the host loopback).
      # Any local process can watch a screen: security is the hub's seat,
      # not RFB, and the viewer is input-refused at the X server.
      - "127.0.0.1:5901-5908:5901-5908"
    shm_size: "1gb"
    # 10s is too short for Chromium to release its profile lock on stop.
    stop_grace_period: 30s

volumes:
  workspace:
  config:
