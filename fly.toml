# The computer: Vibey, one Fly Machine in syd. Eve, desk and hub share it.
# This was fly.vcmc.toml beside a second file for the Blode computer until
# that computer was destroyed on 2026-09-06; `fly deploy` from the repo root
# now targets this app and there is no second file to confuse it with.
#
# Pairing code is this Machine's secret. Volume is this app's existing
# `vcmc_workspace` (10 GB, syd). Do not create a second volume. The Bot is
# the image's `main`; what makes it Vibey is the tenant content under
# /workspace/.bots/main/data (docs/plans/vibey-on-expert.md).
#
# CPU can idle to $0. Disk cannot.

app = "vcmc-computer"
primary_region = "syd"

[build]
dockerfile = "deploy/fly/Dockerfile"

[processes]
computer = "/usr/local/bin/guest-entrypoint.sh"

[env]
COMPUTER_CLOUD = "fly"
COMPUTER_BIND = "0.0.0.0"
COMPUTER_PORT = "8080"
COMPUTER_URL = "http://127.0.0.1:8080"
HOME = "/home/box"
# Guest-side idle hint. Fly Proxy suspend (auto_stop_machines) is what
# zeros compute. This env is not a substitute for auto_stop = off.
COMPUTER_IDLE_SUSPEND_SEC = "1200"
COMPUTER_VNC_TTL_SEC = "900"
COMPUTER_NOVNC_BASE = "6080"
# COMPUTER_VNC_TOKEN_DIR is deliberately unset. It reaches every child,
# and the hub and the desk are different uids: the hub writes its pixel
# tokens under the hub-owned /workspace/.computer/vnc-tokens init makes,
# the desk keeps start-window's box-owned /tmp/computer-vnc. One shared
# path made the hub write into a box-owned directory (EACCES per fork).
COMPUTER_DESK = "local"
COMPUTER_DATA = "/workspace/.computer/bots.json"
COMPUTER_VNC_HOST = "127.0.0.1"
COMPUTER_VNC_PORT = "5900"
COMPUTER_EVE_BOTS = "/opt/computer/apps/eve/bots"

[http_service]
processes = ["computer"]
internal_port = 8080
force_https = true
# Suspend (not stop): faster wake; CPU/RAM bill $0 while suspended.
# Railway WhatsApp bridge POST starts it again.
# A linked WhatsApp number needs the socket up, so linking one on this
# tenant means auto_stop_machines off and min_machines_running 1:
# suspend-to-zero is gone for that tenant, and that is the price of the
# socket living here rather than on a second host. This Machine keeps suspending
# until a number is linked.
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 20
hard_limit = 40

[[http_service.checks]]
grace_period = "40s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[mounts]]
source = "vcmc_workspace"
destination = "/workspace"
processes = ["computer"]

# shared-cpu-2x / 2 GB, Fly's ceiling for a Machine that can suspend, so this
# number is the reason Bots sleep rather than a budget to raise.
[[vm]]
processes = ["computer"]
cpu_kind = "shared"
cpus = 2
memory = "2gb"

[deploy]
strategy = "immediate"
